<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeRight" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes draw { from { stroke-dashoffset: 520; } to { stroke-dashoffset: 0; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .name { animation: fadeUp 0.9s ease-out both; }
      .sub { animation: fadeUp 0.9s ease-out 0.25s both; }
      .rule { stroke-dasharray: 520; animation: draw 1.4s ease-out 0.4s both; }
      .chrome { animation: fadeIn 1.2s ease-out both; }
      .candle { animation: fadeUp 0.5s ease-out both; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .dot { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- base -->
  <clipPath id="card"><rect width="1200" height="380" rx="16"/></clipPath>
  <g clip-path="url(#card)">
  <rect width="1200" height="380" fill="#000"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <rect width="760" height="380" fill="url(#fadeRight)"/>

  <!-- frame + corner brackets -->
  <g class="chrome" stroke="#3a3a3a" stroke-width="1.5" fill="none">
    <path d="M24 44V24H44"/>
    <path d="M1156 24H1176V44"/>
    <path d="M24 336V356H44"/>
    <path d="M1156 356H1176V336"/>
  </g>

  <!-- top bar -->
  <g class="chrome mono" font-size="12" fill="#5c5c5c" letter-spacing="2">
    <text x="60" y="52">~/matt-s/README.md</text>
    <text x="1140" y="52" text-anchor="end">EST. AUSTRALIA</text>
  </g>
  <line class="chrome" x1="60" y1="66" x2="1140" y2="66" stroke="#1c1c1c"/>

  <!-- name -->
  <g class="name">
    <text class="sans" x="56" y="200" font-size="124" font-weight="800" fill="#ffffff" textLength="480" lengthAdjust="spacingAndGlyphs">MATT S</text>
    <rect class="cursor" x="566" y="110" width="14" height="92" fill="#ffffff"/>
  </g>

  <line class="rule" x1="60" y1="232" x2="580" y2="232" stroke="#ffffff" stroke-width="2"/>

  <g class="sub mono" fill="#9a9a9a" font-size="15" letter-spacing="4">
    <text x="60" y="266">ROBLOX DEVELOPER  /  XAUUSD TRADER</text>
  </g>
  <g class="sub mono" fill="#5c5c5c" font-size="13" letter-spacing="2">
    <text x="60" y="294">roblox studio · lua · luau · game systems</text>
  </g>

  <!-- chart panel -->
  <g class="chrome">
    <rect x="760" y="92" width="380" height="214" fill="#050505" stroke="#1f1f1f"/>
    <text class="mono" x="776" y="114" font-size="11" fill="#6a6a6a" letter-spacing="2">XAUUSD · H1</text>
    <circle class="dot" cx="1122" cy="110" r="3.5" fill="#ffffff"/>
    <g stroke="#1a1a1a" stroke-dasharray="3 5">
      <line x1="770" y1="140" x2="1130" y2="140"/>
      <line x1="770" y1="180" x2="1130" y2="180"/>
      <line x1="770" y1="220" x2="1130" y2="220"/>
      <line x1="770" y1="260" x2="1130" y2="260"/>
    </g>
  </g>

  <!-- candles: bull = white body, bear = hollow -->
  <g stroke-width="1.5">
    <g class="candle" style="animation-delay:0.50s"><line x1="786" y1="228" x2="786" y2="268" stroke="#777"/><rect x="780" y="243" width="12" height="17" fill="#fff"/></g>
    <g class="candle" style="animation-delay:0.56s"><line x1="806" y1="238" x2="806" y2="262" stroke="#777"/><rect x="800" y="243" width="12" height="9" fill="#000" stroke="#bbb"/></g>
    <g class="candle" style="animation-delay:0.62s"><line x1="826" y1="222" x2="826" y2="258" stroke="#777"/><rect x="820" y="228" width="12" height="24" fill="#fff"/></g>
    <g class="candle" style="animation-delay:0.68s"><line x1="846" y1="224" x2="846" y2="246" stroke="#777"/><rect x="840" y="228" width="12" height="9" fill="#000" stroke="#bbb"/></g>
    <g class="candle" style="animation-delay:0.74s"><line x1="866" y1="206" x2="866" y2="244" stroke="#777"/><rect x="860" y="213" width="12" height="24" fill="#fff"/></g>
    <g class="candle" style="animation-delay:0.80s"><line x1="886" y1="196" x2="886" y2="220" stroke="#777"/><rect x="880" y="204" width="12" height="9" fill="#fff"/></g>
    <g class="candle" style="animation-delay:0.86s"><line x1="906" y1="200" x2="906" y2="226" stroke="#777"/><rect x="900" y="204" width="12" height="14" fill="#000" stroke="#bbb"/></g>
    <g class="candle" style="animation-delay:0.92s"><line x1="926" y1="212" x2="926" y2="232" stroke="#777"/><rect x="920" y="218" width="12" height="6" fill="#000" stroke="#bbb"/></g>
    <g class="candle" style="animation-delay:0.98s"><line x1="946" y1="192" x2="946" y2="228" stroke="#777"/><rect x="940" y="198" width="12" height="24" fill="#fff"/></g>
    <g class="candle" style="animation-delay:1.04s"><line x1="966" y1="173" x2="966" y2="204" stroke="#777"/><rect x="960" y="180" width="12" height="18" fill="#fff"/></g>
    <g class="candle" style="animation-delay:1.10s"><line x1="986" y1="176" x2="986" y2="196" stroke="#777"/><rect x="980" y="180" width="12" height="8" fill="#000" stroke="#bbb"/></g>
    <g class="candle" style="animation-delay:1.16s"><line x1="1006" y1="158" x2="1006" y2="194" stroke="#777"/><rect x="1000" y="166" width="12" height="22" fill="#fff"/></g>
    <g class="candle" style="animation-delay:1.22s"><line x1="1026" y1="160" x2="1026" y2="182" stroke="#777"/><rect x="1020" y="166" width="12" height="7" fill="#000" stroke="#bbb"/></g>
    <g class="candle" style="animation-delay:1.28s"><line x1="1046" y1="140" x2="1046" y2="178" stroke="#777"/><rect x="1040" y="148" width="12" height="25" fill="#fff"/></g>
    <g class="candle" style="animation-delay:1.34s"><line x1="1066" y1="128" x2="1066" y2="156" stroke="#777"/><rect x="1060" y="136" width="12" height="12" fill="#fff"/></g>
    <g class="candle" style="animation-delay:1.40s"><line x1="1086" y1="132" x2="1086" y2="152" stroke="#777"/><rect x="1080" y="136" width="12" height="8" fill="#000" stroke="#bbb"/></g>
    <g class="candle" style="animation-delay:1.46s"><line x1="1106" y1="124" x2="1106" y2="160" stroke="#777"/><rect x="1100" y="130" width="12" height="20" fill="#fff"/></g>
  </g>

  <!-- bottom bar -->
  <line class="chrome" x1="60" y1="322" x2="1140" y2="322" stroke="#1c1c1c"/>
  <g class="chrome mono" font-size="12" fill="#5c5c5c" letter-spacing="2">
    <text x="60" y="344">MSPROJECTS.ONLINE</text>
    <text x="600" y="344" text-anchor="middle">HANDWRITTEN LUAU · MINIMAL AI</text>
    <text x="1140" y="344" text-anchor="end">STATUS: BUILDING</text>
  </g>
  </g>
</svg>
